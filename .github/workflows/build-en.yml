# Rebuilds en/index.html (areizos.com/en/) whenever index.html changes.
name: Build English page
on:
  push:
    branches: [main]
    paths: [index.html, scripts/build-en.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-en.py
      - run: |
          git diff --quiet en/index.html && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add en/index.html
          git commit -m "Rebuild English page from index.html"
          git push
